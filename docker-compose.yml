version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: college_timetable_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-college_timetable}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-college_timetable}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: college_timetable_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-college_timetable}?schema=public
      PORT: 4000
      NODE_ENV: development
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret_access_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-secret_refresh_key}
      ML_SERVICE_URL: http://ml-service:8000
      CLIENT_ORIGIN: http://localhost:5173
    networks:
      - cms-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: college_timetable_ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      ML_PORT: 8000
      MODEL_PATH: models/attendance_model.joblib
    networks:
      - cms-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: college_timetable_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:4000/api
    networks:
      - cms-network

volumes:
  postgres_data:
    driver: local

networks:
  cms-network:
    driver: bridge
